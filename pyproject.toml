[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subglot"
version = "0.1.1"
description = "Local-first subtitle transcription and translation pipeline: Whisper on your machine, LLM translation via any OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "roclee0703" }]
keywords = ["subtitle", "captions", "whisper", "translation", "srt", "localization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Captions",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The transcription backend pulls in ctranslate2; translation-only users can skip it.
# NOTE: faster-whisper (as of 1.2.1) passes metadata_errors= to av.open(),
# which PyAV removed in 15.x -- pin av below that until faster-whisper adapts.
asr = ["faster-whisper>=1.0", "av>=11,<15"]
dev = ["pytest>=8"]
test = ["pytest>=8"]

[project.scripts]
subglot = "subglot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
